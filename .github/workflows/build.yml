name: Build MSN Keep APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: unzip -q MSNKeep-source.zip -d src

      - name: Force inject setValue and getValue imports
        run: |
          find src/MSNKeep/app/src/main/java -name "*.kt" -exec sed -i '/^package /a import androidx.compose.runtime.getValue\nimport androidx.compose.runtime.setValue' {} +

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        working-directory: src/MSNKeep
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp src/MSNKeep/app/build/outputs/apk/debug/app-debug.apk MSN-Keep.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MSN-Keep-apk
          path: MSN-Keep.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-${{ github.run_number }}
          name: MSN Keep build ${{ github.run_number }}
          files: MSN-Keep.apk
