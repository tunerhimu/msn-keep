name: Build MSN Keep APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: unzip -q MSNKeep-source.zip -d src

      - name: Auto-fix missing Compose setValue/getValue imports
        run: |
          python3 -c '
          import glob
          for path in glob.glob("src/MSNKeep/app/src/main/java/**/*.kt", recursive=True):
              with open(path, "r") as f:
                  code = f.read()
              if "mutableStateOf" in code and "import androidx.compose.runtime.setValue" not in code:
                  code = code.replace(
                      "import androidx.compose.runtime.mutableStateOf",
                      "import androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.setValue"
                  )
                  with open(path, "w") as f:
                      f.write(code)
                  print("Fixed:", path)
          '

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        working-directory: src/MSNKeep
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp src/MSNKeep/app/build/outputs/apk/debug/app-debug.apk MSN-Keep.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MSN-Keep-apk
          path: MSN-Keep.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-${{ github.run_number }}
          name: MSN Keep build ${{ github.run_number }}
          files: MSN-Keep.apk
